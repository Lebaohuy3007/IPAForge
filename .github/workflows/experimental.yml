name: Experimental Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run unit tests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$DEVICE_ID"
          xcodebuild test \
            -project AppStoreIPADownloader.xcodeproj \
            -scheme AppStoreIPADownloader \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned application
        run: >-
          xcodebuild build
          -project AppStoreIPADownloader.xcodeproj
          -scheme AppStoreIPADownloader
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
      - name: Package build product
        run: |
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug-iphoneos/AppStoreIPADownloader.app \
            build/artifacts/AppStoreIPADownloader-unsigned.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AppStoreIPA-Experimental
          path: build/artifacts/AppStoreIPADownloader-unsigned.app.zip
          if-no-files-found: error
          retention-days: 14
