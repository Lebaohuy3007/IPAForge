name: Experimental Build
run-name: Apple ID Test
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: xcode-27
    env:
      DERIVED_DATA_PATH: build/DerivedData
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            build/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-${{ runner.os }}-27.2-${{ github.ref_name }}-${{ hashFiles('AppStoreIPADownloader.xcodeproj/**', '**/*.swift') }}
          restore-keys: |
            xcode-${{ runner.os }}-27.2-${{ github.ref_name }}-
            xcode-${{ runner.os }}-27.2-
      - name: Run unit tests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$DEVICE_ID"
          set -o pipefail
          xcodebuild test \
            -project AppStoreIPADownloader.xcodeproj \
            -scheme AppStoreIPADownloader \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
      - name: Build unsigned application
        run: |
          set -o pipefail
          xcodebuild build \
            -project AppStoreIPADownloader.xcodeproj \
            -scheme AppStoreIPADownloader \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
      - name: Package build product
        run: |
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "$DERIVED_DATA_PATH/Build/Products/Debug-iphoneos/AppStoreIPADownloader.app" \
            build/artifacts/AppStoreIPADownloader-unsigned.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AppStoreIPA-Experimental
          path: build/artifacts/AppStoreIPADownloader-unsigned.app.zip
          if-no-files-found: error
          retention-days: 14
