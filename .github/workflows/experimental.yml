name: Experimental Build
run-name: Test UI
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run unit tests on an iOS Simulator before building the IPA
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: xcode-27
    env:
      DERIVED_DATA_PATH: build/DerivedData
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Remove unavailable simulator devices
        run: xcrun simctl delete unavailable || true
      - name: Start test simulator
        id: test-simulator
        if: ${{ inputs.run_tests }}
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "$DEVICE_ID" ]]; then
            xcrun simctl list devices available
            echo "::error::No available iPhone simulator was found on this runner."
            exit 1
          fi
          echo "TEST_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" >/dev/null 2>&1 || true
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/DerivedData/Build/Products
            build/DerivedData/Build/Intermediates.noindex
            build/DerivedData/ModuleCache.noindex
            build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-${{ runner.os }}-${{ runner.arch }}-27.2-${{ hashFiles('AppStoreIPADownloader.xcodeproj/project.pbxproj', 'AppStoreIPADownloader.xcodeproj/xcshareddata/xcschemes/**', '**/Package.resolved') }}-${{ hashFiles('**/*.swift') }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ runner.arch }}-27.2-${{ hashFiles('AppStoreIPADownloader.xcodeproj/project.pbxproj', 'AppStoreIPADownloader.xcodeproj/xcshareddata/xcschemes/**', '**/Package.resolved') }}-
      - name: Run unit tests
        if: ${{ inputs.run_tests }}
        run: |
          xcrun simctl bootstatus "$TEST_SIMULATOR_ID" -b
          set -o pipefail
          xcodebuild -quiet test \
            -project AppStoreIPADownloader.xcodeproj \
            -scheme AppStoreIPADownloader \
            -destination "platform=iOS Simulator,id=$TEST_SIMULATOR_ID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -parallel-testing-enabled NO \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_TESTABILITY=YES \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | awk '
              /DVTAssertions: Warning in DVTiOSFrameworks\/IDEiOSSupportCore\/DVTiPhoneSimulator\.m:661/ { suppress = 1; next }
              suppress && /Please file a bug at https:\/\/feedbackassistant\.apple\.com/ { suppress = 0; next }
              !suppress { print }
            '
      - name: Build unsigned application
        run: |
          COMMIT_HASH="$(git rev-parse --short=7 HEAD)"
          set -o pipefail
          xcodebuild -quiet build \
            -project AppStoreIPADownloader.xcodeproj \
            -scheme AppStoreIPADownloader \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            IPAForgeCommitHash="$COMMIT_HASH" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | awk '
              /DVTAssertions: Warning in DVTiOSFrameworks\/IDEiOSSupportCore\/DVTiPhoneSimulator\.m:661/ { suppress = 1; next }
              suppress && /Please file a bug at https:\/\/feedbackassistant\.apple\.com/ { suppress = 0; next }
              !suppress { print }
            '
      - name: Package unsigned IPA
        run: |
          mkdir -p build/artifacts
          mkdir -p build/ipa/Payload
          ditto \
            "$DERIVED_DATA_PATH/Build/Products/Debug-iphoneos/AppStoreIPADownloader.app" \
            build/ipa/Payload/AppStoreIPADownloader.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ipa/Payload \
            "build/artifacts/IPAForge-1.0.0-${GITHUB_RUN_NUMBER}-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: IPAForge-1.0.0-${{ github.run_number }}-Unsigned
          path: build/artifacts/IPAForge-1.0.0-${{ github.run_number }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Save build cache
        if: success() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/DerivedData/Build/Products
            build/DerivedData/Build/Intermediates.noindex
            build/DerivedData/ModuleCache.noindex
            build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-${{ runner.os }}-${{ runner.arch }}-27.2-${{ hashFiles('AppStoreIPADownloader.xcodeproj/project.pbxproj', 'AppStoreIPADownloader.xcodeproj/xcshareddata/xcschemes/**', '**/Package.resolved') }}-${{ hashFiles('**/*.swift') }}
