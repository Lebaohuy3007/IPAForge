name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create or release (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run unit tests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$DEVICE_ID"
          xcodebuild test \
            -project AppStoreIPADownloader.xcodeproj \
            -scheme AppStoreIPADownloader \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Archive unsigned app
        run: |
          COMMIT_HASH="$(git rev-parse --short=7 HEAD)"
          xcodebuild archive \
            -project AppStoreIPADownloader.xcodeproj \
            -scheme AppStoreIPADownloader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AppStoreIPADownloader.xcarchive \
            IPAForgeCommitHash="$COMMIT_HASH" \
            CODE_SIGNING_ALLOWED=NO
      - name: Package archive
        run: |
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/AppStoreIPADownloader.xcarchive \
            build/artifacts/AppStoreIPADownloader-unsigned.xcarchive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AppStoreIPA-Release
          path: build/artifacts/AppStoreIPADownloader-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          build/artifacts/AppStoreIPADownloader-unsigned.xcarchive.zip
          --target "$GITHUB_SHA"
          --title "$RELEASE_TAG"
          --generate-notes
